<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة الإدارة - بسمات الوعد الأهلية</title>

    <style>
        :root {
            --primary-purple: #4a2e6f;
            --light-purple: #6a439c;
            --accent-gold: #f3b137;
            --bg-gradient: linear-gradient(135deg, #2b1f3d 0%, #4a2e6f 35%, #3d2e0f 70%, #1f1707 100%);

        .star {

            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(105vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;

        label {

        .request-item {

        @keyframes adminGlow {

<body>

<div class="stars-container" id="stars"></div>

<div class="container" id="adminContainerBox">

    <img
        src="https://i.ibb.co/ddsMPQH/logo.png"
        alt="شعار بسمات الوعد"
        class="logo-img"
    >

    <h1>روضة وابتدائية بسمات الوعد الأهلية بطريف</h1>
    <h2>🔒 لوحة التحكم والإدارة المحصنة</h2>

    <!-- تسجيل الدخول -->
    <div id="loginSection" style="margin-top:20px;">

        <div class="form-group">
            <label>أدخل رمز المرور السري للإدارة:</label>

            <input
                type="password"
                id="adminPasswordInput"
                placeholder="أدخل كلمة المرور"
                inputmode="numeric"
                autocomplete="current-password"
                maxlength="100"
                onkeydown="if(event.key === 'Enter') checkAdminLogin()"
            >
        </div>

        <button
            class="btn-submit"
            id="loginButton"
            onclick="checkAdminLogin()"
        >
            دخول لوحة التحكم
        </button>

        <div id="loginStatus" class="connection-status"></div>
    </div>


    <!-- لوحة الإدارة -->
    <div id="adminPanelSection" class="hidden" style="margin-top: 15px;">

        <div class="admin-tabs">

            <button
                class="tab-btn active"
                id="tabRequests"
                onclick="switchAdminTab('requests')"
            >
                الطلبات الواردة
            </button>

            <button
                class="tab-btn"
                id="tabStudents"
                onclick="switchAdminTab('students')"
            >
                إدارة سجل الطلاب
            </button>

        </div>


        <!-- الطلبات -->
        <div id="adminRequestsView">

            <div id="requestsList">
                <p>جاري تحميل الطلبات...</p>
            </div>

        </div>


        <!-- الطلاب -->
        <div id="adminStudentsView" class="hidden" style="text-align: right;">

            <div style="background: #f8f5fc; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e2d9eb;">

                <h3 style="color: var(--primary-purple); margin-top: 0; font-size:14px;">
                    ➕ إضافة طالب جديد لقاعدة البيانات
                </h3>

                <div class="form-group" style="margin-bottom:8px;">
                    <label>اسم الطالب الثلاثي:</label>

                    <input
                        type="text"
                        id="newStudentName"
                        placeholder="اسم الطالب أو الطالبة"
                        maxlength="150"
                    >
                </div>

                <div class="form-group" style="margin-bottom:8px;">
                    <label>الصف / المستوى:</label>

                    <input
                        type="text"
                        id="newStudentClass"
                        placeholder="مثال: ثالث ابتدائي / روضة"
                        maxlength="100"
                    >
                </div>

                <div class="form-group" style="margin-bottom:8px;">
                    <label>كود الأمان الخاص به (للعائلة):</label>

                    <input
                        type="text"
                        id="newStudentCode"
                        placeholder="الكود الموحد (مثال: 1234)"
                        inputmode="numeric"
                        maxlength="30"
                    >
                </div>

                <button
                    class="btn-submit"
                    id="addStudentButton"
                    style="padding:9px; font-size:13px;"
                    onclick="addNewStudent()"
                >
                    حفظ الطالب في النظام
                </button>

            </div>

            <h3 style="font-size:14px; color:var(--primary-purple);">
                قائمة الطلاب المسجلين حالياً:
            </h3>

            <div
                id="studentsListContainer"
                style="max-height: 220px; overflow-y: auto;"
            >
                <p>جاري التحميل...</p>
            </div>

        </div>


        <!-- تسجيل خروج -->
        <button
            class="btn-submit"
            style="background:#e2d9eb; color:#333; margin-top:15px; font-size:13px;"
            onclick="logoutAdmin()"
        >
            تسجيل خروج 🔒
        </button>

        <div id="connectionStatus" class="connection-status"></div>

    </div>


    <footer>
        تم انشاء هذي الصفحه من قبل اخلاص الحضيري | وكيلة المدرسة
    </footer>

</div>


<script>

    /* =========================================================
       إعدادات الاتصال
       ========================================================= */

    const API_URL =
        "https://gtbgfndskfofcxgtgqlc.supabase.co/functions/v1/parent-api";

    const SESSION_KEY = "bsm_admin_session";

    let soundInterval = null;

    let pollInterval = null;

    let refreshInterval = null;

    let isLoadingRequests = false;

    let isLoadingStudents = false;

    let lastPendingCount = 0;


    /* =========================================================
       النجوم
       ========================================================= */

    function createStars() {

        const container = document.getElementById('stars');

        const types = ['gold', 'bright', 'orange'];

        for (let i = 0; i < 35; i++) {

            const star = document.createElement('div');

            star.classList.add(
                'star',
                types[Math.floor(Math.random() * types.length)]
            );

            const size = Math.random() * 2.5 + 1;

            star.style.width = `${size}px`;

            star.style.height = `${size}px`;

            star.style.left = `${Math.random() * 100}%`;

            star.style.animationDuration =
                `${Math.random() * 4 + 3}s`;

            star.style.animationDelay =
                `${Math.random() * 5}s`;

            container.appendChild(star);
        }
    }

    createStars();


    /* =========================================================
       أدوات عامة
       ========================================================= */

    function getSessionToken() {

        return sessionStorage.getItem(SESSION_KEY) || "";
    }


    function saveSessionToken(token) {

        if (token) {

            sessionStorage.setItem(
                SESSION_KEY,
                token
            );
        }
    }


    function clearSessionToken() {

        sessionStorage.removeItem(
            SESSION_KEY
        );
    }


    function setConnectionStatus(message, isError = false) {

        const loginStatus =
            document.getElementById('loginStatus');

        const panelStatus =
            document.getElementById('connectionStatus');

        if (loginStatus) {

            loginStatus.textContent =
                message || "";

            loginStatus.style.color =
                isError ? "#d9534f" : "#777";
        }

        if (panelStatus) {

            panelStatus.textContent =
                message || "";

            panelStatus.style.color =
                isError ? "#d9534f" : "#777";
        }
    }


    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatTime(dateString) {

        try {

            return new Date(dateString)
                .toLocaleTimeString(
                    'ar-SA',
                    {
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );

        } catch (e) {

            return "";
        }
    }


    /* =========================================================
       الاتصال بـ Edge Function
       ========================================================= */

    async function apiRequest(payload, requireAuth = true) {

        const headers = {
            "Content-Type": "application/json"
        };

        if (requireAuth) {

            const token = getSessionToken();

            if (!token) {

                const error =
                    new Error("NO_SESSION");

                error.status = 401;

                throw error;
            }

            headers["Authorization"] =
                "Bearer " + token;
        }


        const response = await fetch(
            API_URL,
            {
                method: "POST",
                headers: headers,
                body: JSON.stringify(payload),
                cache: "no-store"
            }
        );


        let result = null;

        try {

            result = await response.json();

        } catch (e) {

            result = {
                success: false,
                message: "استجابة غير صالحة من الخادم"
            };
        }


        if (!response.ok || result.success === false) {

            const error =
                new Error(
                    result.message ||
                    "حدث خطأ في الاتصال بالخادم"
                );

            error.status =
                response.status;

            throw error;
        }


        return result;
    }


    /* =========================================================
       تسجيل دخول الإدارة
       ========================================================= */

    async function checkAdminLogin() {

        const input =
            document.getElementById(
                'adminPasswordInput'
            );

        const button =
            document.getElementById(
                'loginButton'
            );

        const password =
            input.value.trim();


        if (!password) {

            alert("يرجى إدخال كلمة المرور.");

            return;
        }


        button.disabled = true;

        button.textContent =
            "جاري التحقق...";


        try {

            const result =
                await apiRequest(
                    {
                        action: "admin_login",
                        password: password
                    },
                    false
                );


            if (
                !result.token ||
                typeof result.token !== "string"
            ) {

                throw new Error(
                    "لم يتم استلام جلسة الإدارة من الخادم."
                );
            }


            saveSessionToken(
                result.token
            );


            input.value = "";


            document
                .getElementById('loginSection')
                .classList.add('hidden');


            document
                .getElementById('adminPanelSection')
                .classList.remove('hidden');


            setConnectionStatus(
                "🟢 متصل بالنظام"
            );


            playSoftTone();


            await loadAdminRequests();

            await loadAdminStudents();


            startAdminBackgroundServices();


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            alert(
                error.message ||
                "❌ تعذر تسجيل الدخول."
            );


            clearSessionToken();

        } finally {

            button.disabled = false;

            button.textContent =
                "دخول لوحة التحكم";
        }
    }


    /* =========================================================
       استعادة الجلسة عند فتح الصفحة
       ========================================================= */

    async function restoreAdminSession() {

        const token =
            getSessionToken();


        if (!token) {

            return;
        }


        try {

            await apiRequest(
                {
                    action: "admin_refresh"
                },
                true
            ).then(result => {

                if (result.token) {

                    saveSessionToken(
                        result.token
                    );
                }
            });


            document
                .getElementById('loginSection')
                .classList.add('hidden');


            document
                .getElementById('adminPanelSection')
                .classList.remove('hidden');


            setConnectionStatus(
                "🟢 متصل بالنظام"
            );


            await loadAdminRequests();

            await loadAdminStudents();


            startAdminBackgroundServices();


        } catch (error) {

            console.log(
                "لا توجد جلسة إدارة صالحة حالياً."
            );

            clearSessionToken();

        }
    }


    /* =========================================================
       تحديث الجلسة تلقائياً
       ========================================================= */

    async function refreshAdminSession() {

        const token =
            getSessionToken();


        if (!token) {
            return false;
        }


        try {

            const result =
                await apiRequest(
                    {
                        action: "admin_refresh"
                    },
                    true
                );


            if (result.token) {

                saveSessionToken(
                    result.token
                );

                setConnectionStatus(
                    "🟢 الجلسة نشطة"
                );

                return true;
            }


            return false;

        } catch (error) {

            console.error(
                "Session refresh failed:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                logoutAdmin(
                    false
                );
            }

            return false;
        }
    }


    /* =========================================================
       تشغيل خدمات الإدارة الخلفية
       ========================================================= */

    function startAdminBackgroundServices() {

        stopAdminBackgroundServices();


        /*
         * تحديث الطلبات كل 5 ثوانٍ
         */
        pollInterval =
            setInterval(
                async () => {

                    if (
                        document.visibilityState ===
                        "visible"
                    ) {

                        await loadAdminRequests(
                            true
                        );
                    }

                },
                5000
            );


        /*
         * تجديد الجلسة كل 30 دقيقة.
         * الجلسة نفسها 8 ساعات،
         * لكن طالما الصفحة مفتوحة يتم تجديدها تلقائياً.
         */
        refreshInterval =
            setInterval(
                async () => {

                    await refreshAdminSession();

                },
                30 * 60 * 1000
            );
    }


    function stopAdminBackgroundServices() {

        if (pollInterval) {

            clearInterval(
                pollInterval
            );

            pollInterval = null;
        }


        if (refreshInterval) {

            clearInterval(
                refreshInterval
            );

            refreshInterval = null;
        }


        stopContinuousAlert();
    }


    /* =========================================================
       التبويبات
       ========================================================= */

    function switchAdminTab(tab) {

        document
            .getElementById('tabRequests')
            .classList.remove('active');


        document
            .getElementById('tabStudents')
            .classList.remove('active');


        document
            .getElementById('adminRequestsView')
            .classList.add('hidden');


        document
            .getElementById('adminStudentsView')
            .classList.add('hidden');


        if (tab === 'requests') {

            document
                .getElementById('tabRequests')
                .classList.add('active');


            document
                .getElementById('adminRequestsView')
                .classList.remove('hidden');


            loadAdminRequests();

        } else {

            document
                .getElementById('tabStudents')
                .classList.add('active');


            document
                .getElementById('adminStudentsView')
                .classList.remove('hidden');


            loadAdminStudents();
        }
    }


    /* =========================================================
       الصوت
       ========================================================= */

    function playSoftTone() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return;
            }


            const audioCtx =
                new AudioContext();


            if (
                audioCtx.state ===
                "suspended"
            ) {

                audioCtx.resume();
            }


            [523.25, 659.25, 783.99]
                .forEach(
                    (freq, index) => {

                        const osc =
                            audioCtx
                                .createOscillator();


                        const gain =
                            audioCtx
                                .createGain();


                        osc.type =
                            'sine';


                        osc.frequency
                            .setValueAtTime(
                                freq,
                                audioCtx.currentTime +
                                (index * 0.15)
                            );


                        gain.gain
                            .setValueAtTime(
                                0.3,
                                audioCtx.currentTime +
                                (index * 0.15)
                            );


                        gain.gain
                            .exponentialRampToValueAtTime(
                                0.001,
                                audioCtx.currentTime +
                                (index * 0.15) +
                                0.3
                            );


                        osc.connect(gain);

                        gain.connect(
                            audioCtx.destination
                        );


                        osc.start(
                            audioCtx.currentTime +
                            (index * 0.15)
                        );


                        osc.stop(
                            audioCtx.currentTime +
                            (index * 0.15) +
                            0.3
                        );
                    }
                );


            setTimeout(
                () => {
                    try {
                        audioCtx.close();
                    } catch (e) {}
                },
                1500
            );

        } catch (e) {

            console.log(
                "Audio unavailable"
            );
        }
    }


    function startContinuousAlert() {

        if (!soundInterval) {

            playSoftTone();


            soundInterval =
                setInterval(
                    playSoftTone,
                    4000
                );


            document
                .getElementById(
                    'adminContainerBox'
                )
                .classList.add(
                    'admin-alert-glow'
                );
        }
    }


    function stopContinuousAlert() {

        if (soundInterval) {

            clearInterval(
                soundInterval
            );

            soundInterval = null;
        }


        document
            .getElementById(
                'adminContainerBox'
            )
            .classList.remove(
                'admin-alert-glow'
            );
    }


    /* =========================================================
       تحميل الطلبات
       ========================================================= */

    async function loadAdminRequests(
        silent = false
    ) {

        if (isLoadingRequests) {
            return;
        }


        if (!getSessionToken()) {
            return;
        }


        isLoadingRequests = true;


        try {

            const result =
                await apiRequest(
                    {
                        action:
                            "admin_get_requests"
                    },
                    true
                );


            const requests =
                Array.isArray(
                    result.requests
                )
                    ? result.requests
                    : [];


            const pendingCount =
                requests.filter(
                    r =>
                        r.status ===
                        "pending"
                ).length;


            /*
             * إذا وصل طلب جديد،
             * نشغل التنبيه.
             */
            if (pendingCount > 0) {

                startContinuousAlert();

            } else {

                stopContinuousAlert();
            }


            /*
             * صوت إضافي عند وصول طلب جديد
             */
            if (
                pendingCount >
                lastPendingCount
            ) {

                playSoftTone();
            }


            lastPendingCount =
                pendingCount;


            renderRequests(
                requests
            );


            setConnectionStatus(
                "🟢 آخر تحديث: " +
                new Date()
                    .toLocaleTimeString(
                        'ar-SA',
                        {
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit'
                        }
                    )
            );


        } catch (error) {

            console.error(
                "Load requests error:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                await handleSessionExpired();

            } else if (!silent) {

                document
                    .getElementById(
                        'requestsList'
                    )
                    .innerHTML =
                    "<p>تعذر تحميل الطلبات حالياً.</p>";

                setConnectionStatus(
                    "🔴 تعذر الاتصال بالنظام",
                    true
                );
            }

        } finally {

            isLoadingRequests = false;
        }
    }


    /* =========================================================
       عرض الطلبات
       ========================================================= */

    function renderRequests(
        requests
    ) {

        const listDiv =
            document.getElementById(
                'requestsList'
            );


        if (
            !requests ||
            requests.length === 0
        ) {

            listDiv.innerHTML =
                "<p>لا توجد طلبات واردة حالياً.</p>";

            return;
        }


        listDiv.innerHTML = "";


        requests.forEach(
            req => {

                const student =
                    req.students || {};


                const studentName =
                    student.student_name ||
                    req.student_name ||
                    "غير معروف";


                const studentClass =
                    student.class_name ||
                    req.student_class ||
                    "غير محدد";


                const parentCode =
                    student.parent_code ||
                    req.parent_code ||
                    "غير متوفر";


                const isDone =
                    req.status ===
                    'approved';


                const isRejected =
                    req.status ===
                    'rejected';


                const isPending =
                    req.status ===
                    'pending';


                let itemClass =
                    'request-item';


                if (isDone) {

                    itemClass +=
                        ' done';

                } else if (isRejected) {

                    itemClass +=
                        ' rejected';
                }


                let statusBadge =
                    `<span class="badge badge-done">
                        تمت الموافقة ✅
                    </span>`;


                if (isPending) {

                    statusBadge =
                        `<span class="badge" style="background:#fff3cd; color:#856404;">
                            ⏳ بانتظار الإجراء
                        </span>`;
                }


                if (isRejected) {

                    statusBadge =
                        `<span class="badge badge-rejected">
                            مرفوض ❌
                        </span>`;
                }


                /*
                 * النوع أصبح يعتمد مباشرة على request_type
                 * وليس على reject_reason.
                 */
                const isPermission =
                    req.request_type ===
                    "excuse";


                let typeBadgeHtml;


                if (isPermission) {

                    typeBadgeHtml =
                        `<span class="type-badge-permission">
                            ⚡ استئذان مبكر
                        </span>`;

                } else {

                    typeBadgeHtml =
                        `<span class="type-badge-dismissal">
                            🚶‍♂️ نداء انصراف
                        </span>`;
                }


                let extraDetailsHtml =
                    "";


                /*
                 * سبب الاستئذان
                 */
                if (
                    isPermission &&
                    req.excuse_reason
                ) {

                    extraDetailsHtml =
                        `<div style="margin-top:5px; font-size:12px; color:#555;">
                            سبب الاستئذان:
                            <span class="badge">
                                ${escapeHtml(
                                    req.excuse_reason
                                )}
                            </span>
                        </div>`;
                }


                /*
                 * سبب الرفض
                 */
                if (
                    isRejected &&
                    req.reject_reason
                ) {

                    extraDetailsHtml +=
                        `<div style="margin-top:5px; font-size:12px; color:#721c24;">
                            سبب الرفض:
                            <span class="badge-reject-reason">
                                ${escapeHtml(
                                    req.reject_reason
                                )}
                            </span>
                        </div>`;
                }


                let actionButtons =
                    "";


                if (isPending) {

                    actionButtons =
                        `<div class="btn-action-group">

                            <button
                                class="btn-approve"
                                onclick="updateRequestStatus('${escapeHtml(req.id)}', 'approved')"
                            >
                                موافقة وتجهيز
                            </button>

                            <button
                                class="btn-reject"
                                onclick="promptRejectReason('${escapeHtml(req.id)}')"
                            >
                                رفض الطلب
                            </button>

                        </div>`;
                }


                listDiv.innerHTML +=

                    `<div class="${itemClass}">

                        <div style="display:flex; justify-content:space-between; align-items:center;">

                            <div>

                                <strong style="font-size:15px; color:var(--primary-purple);">
                                    ${escapeHtml(studentName)}
                                </strong>

                                <span style="font-size:12px; color:#555; margin-right:6px;">
                                    (${escapeHtml(studentClass)})
                                </span>

                            </div>

                            <span style="font-size:11px; color:#888;">
                                ${escapeHtml(
                                    formatTime(
                                        req.created_at
                                    )
                                )}
                            </span>

                        </div>


                        <div class="request-box-content">

                            <div style="display:flex; justify-content:space-between; align-items:center;">

                                <span>
                                    نوع النداء:
                                    ${typeBadgeHtml}
                                </span>

                            </div>

                            ${extraDetailsHtml}

                        </div>


                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#666; margin-top:4px;">

                            <div>

                                <span>
                                    الاسم:
                                    <strong style="color:var(--success-green);">
                                        صحيح ✅
                                    </strong>
                                </span>

                                |

                                <span>
                                    الكود:
                                    <strong style="color:var(--primary-purple);">
                                        ${escapeHtml(parentCode)}
                                    </strong>
                                </span>

                            </div>

                            <div>
                                ${statusBadge}
                            </div>

                        </div>


                        ${actionButtons}

                    </div>`;
            }
        );
    }


    /* =========================================================
       قبول / رفض الطلب
       ========================================================= */

    async function updateRequestStatus(
        reqId,
        newStatus,
        reason = ''
    ) {

        if (!reqId) {
            return;
        }


        try {

            const buttons =
                document.querySelectorAll(
                    `[onclick*="'${reqId}'"]`
                );


            buttons.forEach(
                button => {
                    button.disabled = true;
                }
            );


            const result =
                await apiRequest(
                    {
                        action:
                            "admin_update_request",

                        id:
                            Number(reqId),

                        status:
                            newStatus,

                        reject_reason:
                            reason || null
                    },
                    true
                );


            if (result.success) {

                await loadAdminRequests();

                if (newStatus === 'approved') {

                    alert(
                        "تمت الموافقة على الطلب ✅"
                    );

                } else if (
                    newStatus === 'rejected'
                ) {

                    alert(
                        "تم رفض الطلب وحفظ السبب ✅"
                    );
                }
            }


        } catch (error) {

            console.error(
                "Update request error:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                await handleSessionExpired();

            } else {

                alert(
                    error.message ||
                    "تعذر تحديث حالة الطلب."
                );
            }

        } finally {

            await loadAdminRequests(
                true
            );
        }
    }


    function promptRejectReason(
        reqId
    ) {

        const reason =
            prompt(
                "أدخل سبب الرفض (مثال: بيانات غير مطابقة، الطالب غائب...):"
            );


        if (
            reason !== null &&
            reason.trim() !== ""
        ) {

            updateRequestStatus(
                reqId,
                'rejected',
                reason.trim()
            );

        } else if (
            reason !== null
        ) {

            alert(
                "يرجى إدخال سبب صحيح للرفض!"
            );
        }
    }


    /* =========================================================
       الطلاب
       ========================================================= */

    async function loadAdminStudents() {

        if (isLoadingStudents) {
            return;
        }


        if (!getSessionToken()) {
            return;
        }


        isLoadingStudents = true;


        const container =
            document.getElementById(
                'studentsListContainer'
            );


        try {

            const result =
                await apiRequest(
                    {
                        action:
                            "admin_get_students"
                    },
                    true
                );


            const students =
                Array.isArray(
                    result.students
                )
                    ? result.students
                    : [];


            if (
                !students ||
                students.length === 0
            ) {

                container.innerHTML =
                    "<p>لا توجد بيانات طلاب مسجلة.</p>";

                return;
            }


            container.innerHTML =
                "";


            students.forEach(
                student => {

                    container.innerHTML +=

                        `<div class="student-row">

                            <span>

                                <strong>
                                    ${escapeHtml(
                                        student.student_name
                                    )}
                                </strong>

                                (${escapeHtml(
                                    student.class_name ||
                                    'بدون صف'
                                )})

                                -

                                الكود:
                                <strong>
                                    ${escapeHtml(
                                        student.parent_code
                                    )}
                                </strong>

                            </span>


                            <button
                                class="btn-delete-student"
                                onclick="deleteStudent(${Number(student.id)})"
                            >
                                حذف
                            </button>

                        </div>`;
                }
            );


        } catch (error) {

            console.error(
                "Load students error:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                await handleSessionExpired();

            } else {

                container.innerHTML =
                    "<p>تعذر تحميل قائمة الطلاب.</p>";
            }

        } finally {

            isLoadingStudents = false;
        }
    }


    /* =========================================================
       إضافة طالب
       ========================================================= */

    async function addNewStudent() {

        const name =
            document
                .getElementById(
                    'newStudentName'
                )
                .value
                .trim();


        const sClass =
            document
                .getElementById(
                    'newStudentClass'
                )
                .value
                .trim();


        const code =
            document
                .getElementById(
                    'newStudentCode'
                )
                .value
                .trim();


        if (
            !name ||
            !sClass ||
            !code
        ) {

            alert(
                'يرجى تعبئة جميع حقول الطالب والكود!'
            );

            return;
        }


        const button =
            document.getElementById(
                'addStudentButton'
            );


        button.disabled = true;

        button.textContent =
            "جاري الحفظ...";


        try {

            const result =
                await apiRequest(
                    {
                        action:
                            "admin_add_student",

                        student_name:
                            name,

                        class_name:
                            sClass,

                        parent_code:
                            code
                    },
                    true
                );


            if (result.success) {

                alert(
                    'تم إضافة الطالب بنجاح ✅'
                );


                document
                    .getElementById(
                        'newStudentName'
                    )
                    .value = "";


                document
                    .getElementById(
                        'newStudentClass'
                    )
                    .value = "";


                document
                    .getElementById(
                        'newStudentCode'
                    )
                    .value = "";


                await loadAdminStudents();
            }


        } catch (error) {

            console.error(
                "Add student error:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                await handleSessionExpired();

            } else {

                alert(
                    error.message ||
                    "تعذر إضافة الطالب."
                );
            }

        } finally {

            button.disabled = false;

            button.textContent =
                "حفظ الطالب في النظام";
        }
    }


    /* =========================================================
       حذف طالب
       ========================================================= */

    async function deleteStudent(
        id
    ) {

        if (!id) {
            return;
        }


        const confirmed =
            confirm(
                "هل أنت متأكد من حذف هذا الطالب؟\n\nسيؤدي حذف الطالب إلى حذف طلباته المرتبطة به أيضاً."
            );


        if (!confirmed) {
            return;
        }


        try {

            const result =
                await apiRequest(
                    {
                        action:
                            "admin_delete_student",

                        id:
                            Number(id)
                    },
                    true
                );


            if (result.success) {

                alert(
                    "تم حذف الطالب بنجاح ✅"
                );

                await loadAdminStudents();

                await loadAdminRequests();
            }


        } catch (error) {

            console.error(
                "Delete student error:",
                error
            );


            if (
                error.status === 401 ||
                error.message === "NO_SESSION"
            ) {

                await handleSessionExpired();

            } else {

                alert(
                    error.message ||
                    "تعذر حذف الطالب."
                );
            }
        }
    }


    /* =========================================================
       انتهاء الجلسة
       ========================================================= */

    async function handleSessionExpired() {

        clearSessionToken();

        stopAdminBackgroundServices();

        stopContinuousAlert();


        document
            .getElementById(
                'adminPanelSection'
            )
            .classList.add(
                'hidden'
            );


        document
            .getElementById(
                'loginSection'
            )
            .classList.remove(
                'hidden'
            );


        setConnectionStatus(
            "انتهت جلسة الإدارة، يرجى تسجيل الدخول مرة أخرى.",
            true
        );


        alert(
            "انتهت جلسة الإدارة. يرجى تسجيل الدخول مرة أخرى."
        );
    }

                'adminPanelSection'
            )
            .classList.add(

            );

            .getElementById(
                'loginSection'
            )

            );

            .getElementById(

            )
            .value = "";


        setConnectionStatus(
            ""
        );
    }

</script>
